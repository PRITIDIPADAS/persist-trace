name: probe
on:
  push:
    branches: [probe-data]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -q decoupler==2.3.1 && mkdir -p out && python tools/probe.py 2>&1 | tee probe.log || true
      - if: always()
        run: |
          mkdir -p out && cp probe.log out/ 2>/dev/null || true
          cd out && git init -q -b probe-results && git config user.name PRITIDIPADAS && git config user.email 249524565+PRITIDIPADAS@users.noreply.github.com
          git add -A && git commit -qm probe && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" probe-results
